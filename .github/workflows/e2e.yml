name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Run E2E against the local build or the live deployment"
        type: choice
        options: [local, live]
        default: local

jobs:
  build-and-test:
    name: Lint, type-check, build & E2E (local build)
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install test dependencies
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests against the production build
        working-directory: e2e
        env:
          LOCAL: "1"
        run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  e2e-live:
    name: E2E against the live site
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'live'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: e2e/playwright-report
          retention-days: 14
